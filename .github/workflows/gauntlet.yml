name: gauntlet
# gauntlet-generator: a591be70b4ae
# Regenerate with `arm-gauntlet.ts --upgrade`. A repo whose stamp differs from
# the installer's is running an older set of gates, which is what the sweep
# checks rather than guessing from what the file happens to contain.
on:
  # Push runs only on the branch this repo publishes from. Every other branch is
  # checked by its pull request instead. Triggering on both used to run the whole
  # gauntlet TWICE for every push to an open pull request, once under each name,
  # and the two never cancelled each other because GitHub files them under
  # different refs. On 2026-09-15 a fleet-wide upgrade did that across every repo
  # and cost more in two days than the rest of the month. A branch pushed with no
  # pull request is no longer checked until one is opened, which is when a check
  # can block anything.
  push:
    branches: ["main"]
  pull_request:
  # A repo you have not touched in three months has not been checked in three
  # months, while new vulnerabilities against what it already ships are
  # published daily. The dependency and secret gates are time-sensitive, not
  # edit-sensitive, so the whole gauntlet also re-runs on a clock. Weekly, not
  # daily: across a fleet of private repos a daily run was the single largest
  # line on the bill, and GitHub's own security alerts, which cost nothing, still
  # flag a newly published vulnerability the day it lands. Silence is not the
  # same as safety, and neither is a bill nobody expected.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
concurrency:
  # A literal, not ${{ github.workflow }}. That expression is the workflow's
  # display NAME, so any two workflow files that happen to share a name share a
  # concurrency group and cancel each other — and a cancelled run is neither a
  # pass nor a failure, so the dashboard recorded it as CANCELLED and the gates
  # simply never reported. Naming the group after this file makes the collision
  # structurally impossible instead of merely unlikely.
  group: gauntlet-gates-${{ github.ref }}
  cancel-in-progress: true
# Read-only by default, and every job that needs more says so itself. The
# default token is otherwise write-capable across the repository, so a scanner
# that pulls a compromised package is a scanner that can push to main. Only
# codeql widens this, and only to publish its own findings.
permissions:
  contents: read
jobs:
  go:
    timeout-minutes: 90
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: 'stable' }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: tests
        run: |
          set +e
          out=$(go test -coverprofile=gauntlet-cover.out ./... 2>&1); code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          # A module with no test files exits 0 having run nothing, which used
          # to be the same green as a module whose tests all passed. Counted
          # (-c) rather than -q: -q stops reading at the first match, and under
          # pipefail a large module's output then fails the pipe on SIGPIPE and
          # reads as "no tests".
          ran=$(printf '%s\n' "$out" | grep -Ec '^(ok|FAIL)[[:space:]]' || true)
          if [ "$ran" -eq 0 ]; then
            if grep -Eq '"tier"[[:space:]]*:[[:space:]]*"production"' .gauntlet.json 2>/dev/null; then
              echo "GATE go-test = FAILED (this repo is marked production, and no package in this repo has a test file)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=GATE go-test FAILED::marked production in .gauntlet.json, and no package in this repo has a test file"
              exit 1
            fi
            echo "GATE go-test = NOT_APPLICABLE (no package in this repo has a test file)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE go-test NOT_APPLICABLE::no package in this repo has a test file — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          echo "GATE go-test = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          floor=$(grep -Eo '"coverageFloorPercent"[[:space:]]*:[[:space:]]*[0-9]+([.][0-9]+)?' .gauntlet.json 2>/dev/null | grep -Eo '[0-9]+([.][0-9]+)?$' || true)
          total=$(go tool cover -func=gauntlet-cover.out 2>/dev/null | awk '/^total:/ { v = $NF; sub(/%$/, "", v); print v + 0 }')
          if [ -z "$floor" ]; then
            echo "GATE coverage = NOT_APPLICABLE (no coverageFloorPercent in .gauntlet.json; this run measured ${total:-nothing})" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE coverage NOT_APPLICABLE::no floor recorded; this run measured ${total:-nothing}%. Re-arm with --upgrade to record one."
          elif [ -z "$total" ]; then
            echo "GATE coverage = FAILED (a floor of $floor% is recorded, but this run printed no coverage total to compare)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif awk -v a="$total" -v b="$floor" 'BEGIN { exit !(a < b) }'; then
            echo "GATE coverage = FAILED (project total $total% is below the floor $floor%)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "GATE coverage = VERIFIED (project total $total% >= floor $floor%)" >> "$GITHUB_STEP_SUMMARY"
          fi
  docker:
    timeout-minutes: 90
    name: Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - name: hadolint
        run: |
          # find -print0 into a read loop, not $(find). A Dockerfile in a
          # directory with a space in its name would otherwise be split into
          # two paths, neither of which exists, and the loop would lint
          # nothing while exiting 0.
          find . -iname 'Dockerfile*' -not -path "./node_modules/*" -print0 |
            while IFS= read -r -d '' f; do
              echo "== $f"
              docker run --rm -i hadolint/hadolint hadolint --no-fail - < "$f" | tee -a "$GITHUB_STEP_SUMMARY"
              docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$f" || exit 1
            done
  secrets:
    timeout-minutes: 90
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      # gitleaks CLI is license-free; the gitleaks-action wrapper is NOT (it requires
      # a paid GITLEAKS_LICENSE on org accounts). Run the binary directly to avoid that.
      - name: secret scan
        run: |
          # actions/checkout announces "Temporarily overriding HOME=..." before
          # it registers its own safe.directory exception, i.e. it writes it to
          # a throwaway global config and takes it away again. The image's
          # /root/.gitconfig is bypassed too, because job containers run with
          # HOME=/github/home. Without this line git cannot open the repo and
          # gitleaks reports a clean scan of nothing.
          git config --global --add safe.directory "$(pwd)"
          set +e
          out=$(gitleaks detect --source . --redact --exit-code 1 --no-banner 2>&1); code=$?
          set -e
          echo "$out"
          # --exit-code covers "leaks were found". Nothing in it covers "the
          # scan could not start", which gitleaks downgrades to a log line
          # before exiting 0.
          if printf '%s' "$out" | grep -Eq 'detected dubious ownership|\[git\] fatal:|stderr is not empty'; then
            echo "GATE secrets = FAILED (gitleaks could not read this repository, so nothing was scanned)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if printf '%s' "$out" | grep -Eq '(^|[^0-9])0 commits scanned|scanned ~0 bytes'; then
            echo "GATE secrets = FAILED (gitleaks read 0 commits / 0 bytes — an armed repo always has committed files)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "GATE secrets = FAILED (gitleaks found secrets in this repository)" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          scanned=$(printf '%s' "$out" | grep -Eo '[0-9]+ commits scanned' | tail -1)
          echo "GATE secrets = VERIFIED (no leaks in $scanned)" >> "$GITHUB_STEP_SUMMARY"
  deps:
    timeout-minutes: 90
    name: dependency CVEs (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: scan lockfiles for known vulnerabilities
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          # Reviewed exceptions from .gauntlet.json become "$@". Directories
          # only: osv-scanner cannot skip a single file.
          if [ ! -f .github/gauntlet-scan-exceptions ]; then
            echo "SCAN EXCEPTIONS = FAILED (.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read; re-arm with --upgrade)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=scan exceptions::.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read. Re-arm with --upgrade."
            exit 1
          fi
          exc_dir=$(mktemp -d)
          python3 .github/gauntlet-scan-exceptions osv "$exc_dir" report
          set --
          while IFS= read -r exc_arg; do set -- "$@" "$exc_arg"; done < "$exc_dir/args"
          set +e
          ./osv-scanner scan source --recursive "$@" ./
          code=$?
          set -e
          # 0 = clean. 1 = vulnerabilities found, and that must fail the build.
          # 128 = no package manifests in this repo, which is not a defect.
          if [ "$code" = "128" ]; then
            echo "GATE deps = NOT_APPLICABLE (no dependency manifests in this repo)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" = "0" ]; then
            echo "GATE deps = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
  phi:
    timeout-minutes: 90
    name: PHI in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: scan log statements for patient identifiers
        run: |
          # Log call on the same line as an unambiguous identifier.
          HARD='(console\.(log|info|warn|error|debug)|logger?\.(log|info|warn|error|debug)|context\.log)[^;]{0,200}\b(ssn|social_security|date_of_birth|dateOfBirth|\bdob\b|medical_record|\bmrn\b|diagnosis_code|icd10)\b'
          # Whole objects stringified into a log — usually carries everything.
          SOFT='(console\.(log|info|warn|error)|logger?\.(log|info|warn|error)|context\.log)[^;]{0,120}JSON\.stringify\((patient|user|profile|subject)'
          hard=$(grep -rInE "$HARD" --include='*.ts' --include='*.tsx' --include='*.js' \
                 --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=__tests__ . || true)
          soft=$(grep -rInE "$SOFT" --include='*.ts' --include='*.tsx' --include='*.js' \
                 --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=__tests__ . || true)
          {
            echo "### PHI-in-logs scan"
            echo "<pre>"
            echo "blocking matches:"; echo "${hard:-  (none)}"
            echo ""; echo "review these (whole object logged):"; echo "${soft:-  (none)}"
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$hard" ]; then
            echo "GATE phi-in-logs = FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GATE phi-in-logs = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
  sbom:
    timeout-minutes: 90
    name: software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 365
  licenses:
    timeout-minutes: 90
    name: licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: inventory dependency licences
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive --experimental-licenses-summary ./ > licences.txt 2>&1
          code=$?
          set -e
          if [ "$code" = "128" ]; then
            echo "GATE licences = NOT_APPLICABLE (no dependency manifests)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Dependency licences"
            echo "<pre>"
            cat licences.txt
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Deny-list, not allow-list: an allow-list would fail every brownfield
          # repo on day one and teach everyone to ignore the gate.
          if grep -Eq '(AGPL|GPL-2|GPL-3|SSPL|CC-BY-NC|BUSL)' licences.txt; then
            echo "GATE licences = FAILED (strong-copyleft or non-commercial licence present)" >> "$GITHUB_STEP_SUMMARY"
            grep -E '(AGPL|GPL-2|GPL-3|SSPL|CC-BY-NC|BUSL)' licences.txt
            exit 1
          fi
          echo "GATE licences = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
  sast:
    timeout-minutes: 90
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: advisory scan (all severities, never blocks)
        run: |
          git config --global --add safe.directory "$(pwd)"
          if [ ! -f .github/gauntlet-scan-exceptions ]; then
            echo "SCAN EXCEPTIONS = FAILED (.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read; re-arm with --upgrade)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=scan exceptions::.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read. Re-arm with --upgrade."
            exit 1
          fi
          exc_dir=$(mktemp -d)
          python3 .github/gauntlet-scan-exceptions semgrep "$exc_dir" quiet
          set --
          while IFS= read -r exc_arg; do set -- "$@" "$exc_arg"; done < "$exc_dir/args"
          semgrep scan --config=p/default --metrics=off --no-error "$@" \
            --text --output=advisory.txt . || true
          {
            echo "### Semgrep advisory findings (not blocking)"
            echo "<pre>"
            tail -c 60000 advisory.txt || echo "(none)"
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: blocking scan (high-confidence only)
        run: |
          # Repeated deliberately: each step must stand on its own, so that
          # deleting the step above can never silently disarm this one.
          git config --global --add safe.directory "$(pwd)"
          if [ ! -f .github/gauntlet-scan-exceptions ]; then
            echo "SCAN EXCEPTIONS = FAILED (.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read; re-arm with --upgrade)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=scan exceptions::.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read. Re-arm with --upgrade."
            exit 1
          fi
          exc_dir=$(mktemp -d)
          python3 .github/gauntlet-scan-exceptions semgrep "$exc_dir" report
          set --
          while IFS= read -r exc_arg; do set -- "$@" "$exc_arg"; done < "$exc_dir/args"
          set +e
          out=$(semgrep scan --config=p/default --metrics=off --severity=ERROR --error "$@" . 2>&1); code=$?
          set -e
          echo "$out"
          targets=$(printf '%s' "$out" | awk '/Ran [0-9]+ rules? on [0-9]+ files?:/ { n = $5 } END { if (n != "") print n }')
          if [ -z "$targets" ]; then
            echo "GATE sast = FAILED (semgrep printed no scan summary, so it cannot be said to have run)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$targets" -eq 0 ]; then
            echo "GATE sast = NOT_APPLICABLE (semgrep found no files it can analyse in this repo)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE sast NOT_APPLICABLE::semgrep found no files it can analyse in this repo — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "GATE sast = VERIFIED (no ERROR-severity findings across $targets files)" >> "$GITHUB_STEP_SUMMARY"
  container:
    timeout-minutes: 90
    name: container posture (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # Reviewed exceptions from .gauntlet.json, handed to the action below as
      # step outputs: whole paths as skip-dirs / skip-files, check-scoped ones
      # as a generated .trivyignore.yaml.
      - name: read reviewed scan exceptions
        id: exceptions
        run: |
          if [ ! -f .github/gauntlet-scan-exceptions ]; then
            echo "SCAN EXCEPTIONS = FAILED (.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read; re-arm with --upgrade)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=scan exceptions::.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read. Re-arm with --upgrade."
            exit 1
          fi
          exc_dir=$(mktemp -d)
          python3 .github/gauntlet-scan-exceptions trivy "$exc_dir" report
          set --
          while IFS= read -r exc_arg; do set -- "$@" "$exc_arg"; done < "$exc_dir/args"
      # Released tags on this action carry a leading "v". @0.28.0 does not
      # exist, so every armed Docker repo failed this step on "unable to
      # resolve action" — a gate that never ran once.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: 'false'
          skip-dirs: ${{ steps.exceptions.outputs.skip_dirs }}
          skip-files: ${{ steps.exceptions.outputs.skip_files }}
          trivyignores: ${{ steps.exceptions.outputs.trivyignores }}
      # trivy does not run in a job container — the action installs the binary
      # and runs it as the runner user — so it never had the ownership failure
      # that silenced the secret scan. It does have the blind spot behind that
      # failure: a scan that parsed no files prints an empty report table and
      # exits 0. The action offers no way to read its own output back, so the
      # same scan is repeated here non-blocking (trivy stays on PATH for the
      # rest of the job) purely to count what it detected.
      - name: prove the scan had something to read
        run: |
          if [ ! -f .github/gauntlet-scan-exceptions ]; then
            echo "SCAN EXCEPTIONS = FAILED (.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read; re-arm with --upgrade)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=scan exceptions::.github/gauntlet-scan-exceptions is missing, so .gauntlet.json cannot be read. Re-arm with --upgrade."
            exit 1
          fi
          exc_dir=$(mktemp -d)
          python3 .github/gauntlet-scan-exceptions trivy "$exc_dir" quiet
          set --
          while IFS= read -r exc_arg; do set -- "$@" "$exc_arg"; done < "$exc_dir/args"
          first_outside_exceptions() {
            exc_test=$1; exc_pattern=$2
            set -- . -path ./.git -prune
            while IFS= read -r exc_path; do set -- "$@" -o -path "./$exc_path" -prune; done < "$exc_dir/excluded"
            find "$@" -o "$exc_test" "$exc_pattern" -print -quit
          }
          out=$(trivy config . --exit-code 0 --skip-version-check "$@" 2>&1) || true
          echo "$out"
          configs=$(printf '%s' "$out" | awk -F'num=' '/Detected config files/ { n = $2 + 0; seen = 1 } END { if (seen) print n }')
          if [ -z "$configs" ]; then
            echo "GATE container = FAILED (trivy never reported what it detected, so this scan proves nothing)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$configs" -eq 0 ]; then
            # Zero has two meanings and they are not the same fact: either the
            # Dockerfile that armed this job is gone, or trivy could not read it.
            # No pipe into grep here on purpose: host jobs run under
            # `bash -e -o pipefail`, where grep -q exiting early SIGPIPEs find
            # and the whole condition reads false — the wrong branch, silently.
            # Dockerfiles under a reviewed exception were skipped on purpose,
            # so only the ones outside every exception count here.
            if [ -n "$(first_outside_exceptions -iname 'Dockerfile*')" ]; then
              echo "GATE container = FAILED (this repo has a Dockerfile and trivy detected 0 config files)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ -s "$exc_dir/excluded" ]; then
            echo "GATE container = NOT_APPLICABLE (every Dockerfile left in this repo is under a reviewed scan exception in .gauntlet.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE container NOT_APPLICABLE::every Dockerfile left in this repo is under a reviewed scan exception in .gauntlet.json — nothing was checked, so this tick verifies nothing"
              exit 0
            fi
            echo "GATE container = NOT_APPLICABLE (no Dockerfile is left in this repo for trivy to inspect)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE container NOT_APPLICABLE::no Dockerfile is left in this repo for trivy to inspect — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          echo "GATE container = VERIFIED (trivy inspected $configs config file(s))" >> "$GITHUB_STEP_SUMMARY"
  pipeline:
    timeout-minutes: 90
    name: pipeline security (zizmor, actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: audit the workflows that run every other gate
        # Versions resolved when this repo was armed, not "latest" at run time:
        # a gate whose scanner can change under it is a gate whose verdict can
        # change without a commit. --upgrade moves both forward deliberately.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ZIZMOR_VERSION: "1.31.1"
        run: |
          shopt -s nullglob
          set -- .github/workflows/*.yml .github/workflows/*.yaml
          if [ "$#" -eq 0 ]; then
            echo "GATE pipeline = NOT_APPLICABLE (this repo has no workflow files to audit)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE pipeline NOT_APPLICABLE::this repo has no workflow files to audit — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          echo "auditing $# workflow file(s)" >> "$GITHUB_STEP_SUMMARY"

          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"             | tar xz -C /usr/local/bin actionlint
          pipx install "zizmor==${ZIZMOR_VERSION}" >/dev/null
          actionlint --version
          zizmor --version

          set +e
          actionlint -no-color "$@" 2>&1 | tee actionlint.out; lint=${PIPESTATUS[0]}
          zizmor --no-progress --min-severity=medium "$@" 2>&1 | tee zizmor.out; zz=${PIPESTATUS[0]}
          set -e
          echo "actionlint exit=$lint  zizmor exit=$zz"

          # tee, not a bare redirect: findings that reach only the step summary
          # are invisible in the log, and the log is where anyone looking at a
          # red tick starts. The first version of this gate hid its own failure
          # that way and cost an extra round trip to diagnose.
          {
            echo "### pipeline security"
            echo '<pre>'
            cat actionlint.out
            cat zizmor.out
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

          # zizmor exits 14 for "findings at or above the threshold" and 0 for
          # none. Any other non-zero is the tool failing to run, which must not
          # read as a pass: a crashed scanner and a clean repo both print
          # nothing useful.
          if [ "$zz" -ne 0 ] && [ "$zz" -ne 14 ]; then
            echo "GATE pipeline = FAILED (zizmor could not complete, exit $zz — nothing was audited)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$zz" -eq 14 ] || [ "$lint" -ne 0 ]; then
            echo "GATE pipeline = FAILED (see the findings above)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GATE pipeline = VERIFIED ($# workflow file(s) audited, no findings at medium or above)" >> "$GITHUB_STEP_SUMMARY"
  supplychain:
    timeout-minutes: 90
    name: supply chain posture (scorecard) — ADVISORY
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: score this repository's own practices
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORECARD_VERSION: "5.6.0"
        run: |
          curl -sSfL "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"             | tar xz -C /usr/local/bin scorecard
          set +e
          scorecard --repo="github.com/${{ github.repository }}" --format=default > scorecard.out 2>&1; code=$?
          set -e
          {
            echo "### supply chain posture (advisory, never blocks)"
            echo '<pre>'
            cat scorecard.out
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] || ! grep -q "Aggregate score" scorecard.out; then
            echo "TIER supplychain = NOT_ARMED (scorecard could not read this repository; it needs a public repo or a token with read access)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=scorecard NOT_ARMED::supply chain posture was not measured"
            exit 0
          fi
          echo "TIER supplychain = REPORTED ($(grep 'Aggregate score' scorecard.out))" >> "$GITHUB_STEP_SUMMARY"
  codeql:
    name: deep analysis (codeql)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      # The CodeQL action reads its own workflow run. On a private repo without
      # this, analyze fails with "Resource not accessible by integration":
      # vortex-email-comply, run 34974718788, red for a missing permission.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the lower-precision rules. This gate exists
          # to find what pattern matching cannot, so trading some noise for
          # reach is the whole point of running it.
          queries: security-extended
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      - id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
          # A private repo without Advanced Security cannot receive the upload.
          # Failing the gate there would mean a red tick that says nothing about
          # the code, so the upload is allowed to fail and the analysis is not.
          upload: failure-only
          output: codeql-results
      - name: report
        if: always()
        # A deep analysis of a codebase nobody has reviewed reports dozens of
        # findings, most of them true statements about code that is not
        # actually reachable by an attacker. Failing on the total forever means
        # a gate that is red on every commit, and a gate that is always red is
        # one people stop reading — the same failure the secret scanner had.
        #
        # So the verdict is against a baseline the repo commits after triage:
        # .codeql-baseline.json, one entry per rule and file with the count
        # that was reviewed and the reason it was accepted. Anything NEW fails.
        # The debt can only shrink, because a count above the recorded one
        # fails just as loudly as a rule that was never reviewed at all.
        run: |
          sarif=$(find codeql-results -name '*.sarif' | head -1)
          if [ -z "$sarif" ]; then
            echo "GATE codeql = FAILED (no results file — the analysis did not complete)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - "$sarif" .codeql-baseline.json <<'GAUNTLET_CODEQL_PY' | tee codeql-report.txt
          import collections, json, os, sys

          sarif, baseline_path = sys.argv[1], sys.argv[2]

          found = collections.Counter()
          for run in json.load(open(sarif))["runs"]:
              for res in run.get("results", []):
                  # A result CodeQL itself considers suppressed by an
                  # inline "// codeql[rule-id]" comment is not a finding.
                  if res.get("suppressions"):
                      continue
                  loc = res["locations"][0]["physicalLocation"]
                  found[(res.get("ruleId", "?"), loc["artifactLocation"]["uri"])] += 1

          baseline = {}
          if os.path.exists(baseline_path):
              raw = json.load(open(baseline_path))
              for entry in raw.get("reviewed", []):
                  baseline[(entry["rule"], entry["file"])] = entry["count"]

          new = {k: n for k, n in found.items() if n > baseline.get(k, 0)}
          gone = {k: n for k, n in baseline.items() if found.get(k, 0) < n}

          print(f"findings: {sum(found.values())}   reviewed baseline: {sum(baseline.values())}")
          for (rule, path), n in sorted(new.items()):
              print(f"NEW  {n - baseline.get((rule, path), 0):3}  {rule}  {path}")
          for (rule, path), n in sorted(gone.items()):
              print(f"FIXED     {rule}  {path} (baseline {n}, now {found.get((rule, path), 0)})")

          if new:
              print("VERDICT=FAILED")
          elif gone:
              # Not a failure: a fixed finding is the point. But the baseline
              # has to be regenerated or it silently re-permits the finding.
              print("VERDICT=STALE")
          else:
              print("VERDICT=OK")
          GAUNTLET_CODEQL_PY

          verdict=$(grep -o 'VERDICT=[A-Z]*' codeql-report.txt | cut -d= -f2)
          {
            echo "### deep analysis (${{ matrix.language }})"
            echo '<pre>'
            cat codeql-report.txt
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$verdict" in
            FAILED)
              echo "GATE codeql = FAILED (${{ matrix.language }}: findings above the reviewed baseline)" >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            STALE)
              echo "GATE codeql = VERIFIED (${{ matrix.language }}: nothing new; the baseline lists findings that no longer occur — regenerate it)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=codeql baseline is stale::findings were fixed; regenerate .codeql-baseline.json so they cannot come back unnoticed" ;;
            *)
              echo "GATE codeql = VERIFIED (${{ matrix.language }}: nothing above the reviewed baseline)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          retention-days: 30
